name: localiq

# Local-LLM profile: runs everything here and talks to Ollama on your machine.
#   docker compose --env-file .env up --build
#
# Public URL: run the named Cloudflare tunnel on the host (see scripts/tunnel.sh)
# against the Caddy edge on http://localhost:8080.

services:
  postgres:
    image: pgvector/pgvector:pg16
    # The dataset is a few hundred rows, so the stock Postgres buffers are
    # generous. Trimming them keeps the container well inside its memory limit
    # on a laptop that is also running a browser, an IDE and the Flutter tools.
    command: >
      postgres
      -c shared_buffers=64MB
      -c work_mem=4MB
      -c maintenance_work_mem=32MB
      -c max_connections=50
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-localiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localiq}
      POSTGRES_DB: ${POSTGRES_DB:-localiq}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-localiq} -d ${POSTGRES_DB:-localiq}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Hard cap so a runaway query cannot balloon the VM. Limits sit above the
    # observed steady state, so they only bite on a genuine leak.
    deploy:
      resources:
        limits:
          memory: 256M
    networks: [localiq]

  backend:
    build:
      context: ../backend
    environment:
      APP_ENV: ${APP_ENV:-production}
      # Required: Settings refuses to boot in production with the shipped dev
      # default, so a missing/placeholder value fails loudly instead of silently
      # making every session and email token forgeable.
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:?set AUTH_SECRET_KEY in infra/.env (openssl rand -hex 32)}
      # Email (Resend). Empty key disables sending; the app keeps its dev
      # fallbacks, so the tunnel works without a provider.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-LocalIQ <onboarding@resend.dev>}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-https://localiq.tavesglobal.com}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:3000,https://localiq.tavesglobal.com}
      LOG_JSON: ${LOG_JSON:-true}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      LOGIN_LOCKOUT_MINUTES: ${LOGIN_LOCKOUT_MINUTES:-15}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      FEEDBACK_WEIGHT: ${FEEDBACK_WEIGHT:-4.0}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-localiq}:${POSTGRES_PASSWORD:-localiq}@postgres:5432/${POSTGRES_DB:-localiq}
      # LLM provider for the agentic travel buddy
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      # Hosted models can be slower than a local one; give the agent room.
      LLM_CHAT_TIMEOUT_SECONDS: ${LLM_CHAT_TIMEOUT_SECONDS:-60}
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
      SEARXNG_ENABLED: ${SEARXNG_ENABLED:-true}
      GOOGLE_MAPS_API_KEY_WEB: ${GOOGLE_MAPS_API_KEY_WEB:-}
      GOOGLE_MAPS_API_KEY_ANDROID: ${GOOGLE_MAPS_API_KEY_ANDROID:-}
      GOOGLE_MAPS_API_KEY_IOS: ${GOOGLE_MAPS_API_KEY_IOS:-}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      GOOGLE_ROUTES_API_KEY: ${GOOGLE_ROUTES_API_KEY:-}
      # Google Sign-In: comma-separated accepted audiences. Empty falls back to
      # unverified dev-mode decoding (never in production).
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      S3_ENABLED: ${S3_ENABLED:-true}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://s3:9090}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-localiq}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_USE_SSL: ${S3_USE_SSL:-false}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://localiq.tavesglobal.com}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_started
      # searxng now lives behind the "discovery" profile, so it is intentionally
      # not a hard dependency: without it the backend falls back to its
      # heuristic extractor instead of failing to start.
    deploy:
      resources:
        limits:
          memory: 384M
    networks: [localiq]

  s3:
    # Local S3-compatible object store for experience photos and media.
    # Default is adobe/s3mock (tiny, no auth, pulls anywhere). For MinIO, use
    # image: minio/minio and command: server /data --console-address ":9001",
    # mapping port 9000:9000 and pointing S3_ENDPOINT at http://s3:9000.
    image: adobe/s3mock:latest
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /tmp/s3root
    ports:
      - "${S3_PORT:-9000}:9090"
    deploy:
      resources:
        limits:
          memory: 256M
    networks: [localiq]

  searxng:
    image: searxng/searxng:latest
    # Off by default. SearXNG only backs the optional web-discovery pipeline, so
    # it costs ~95 MB and extra startup time for nothing during a normal demo.
    # Start it on demand with:  docker compose --profile discovery up -d searxng
    # Without it the backend falls back to its heuristic extractor.
    profiles: ["discovery"]
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-localiq-dev-searxng-secret-change-me}
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-http://localhost:8888/}
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    # Internal-only: the backend reaches it at http://searxng:8080. Expose
    # SEARXNG_PORT on the host only when you want to debug the UI directly.
    ports:
      - "${SEARXNG_PORT:-8888}:8080"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    networks: [localiq]

  nginx-flutter:
    image: nginx:1.27-alpine
    volumes:
      - ../gateway/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${FLUTTER_WEB_DIR:-/Users/emaad/Developer/HackCelestial/localIQ/gateway/placeholders/flutter-web}:/usr/share/nginx/html:ro
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 64M
    networks: [localiq]

  kong:
    image: kong:3.9
    environment:
      KONG_DATABASE: "off"
      # Keep the worker count low: this is a single-laptop demo gateway, and each
      # worker carries its own Lua VM and shared-memory dictionaries.
      KONG_NGINX_WORKER_PROCESSES: "1"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 127.0.0.1:8001
      KONG_PROXY_LISTEN: 0.0.0.0:8000
    volumes:
      - ../gateway/kong/kong.yml:/kong/declarative/kong.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend
    # Kong is the largest container here. The cap sits above its steady state so
    # it only bites on a leak, not during normal traffic.
    deploy:
      resources:
        limits:
          memory: 640M
    networks: [localiq]

  caddy:
    image: caddy:2-alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ../gateway/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - kong
      - nginx-flutter
    deploy:
      resources:
        limits:
          memory: 64M
    networks: [localiq]

volumes:
  postgres-data:

networks:
  localiq:
    driver: bridge
