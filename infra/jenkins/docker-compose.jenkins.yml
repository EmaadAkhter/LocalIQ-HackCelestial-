name: localiq-jenkins

# Self-hosted Jenkins for LocalIQ CI. Not exposed publicly by default.
#   cd infra/jenkins && cp .env.example .env && docker compose -f docker-compose.jenkins.yml --env-file .env up -d --build

services:
  jenkins:
    build:
      context: .
    container_name: localiq-jenkins
    ports:
      - "${JENKINS_PORT:-8081}:8080"
      - "${JENKINS_AGENT_PORT:-50000}:50000"
    environment:
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID:-admin}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:-changeme}
      JENKINS_URL: ${JENKINS_URL:-http://localhost:8081/}
      GITHUB_REPO_URL: ${GITHUB_REPO_URL:-https://github.com/EmaadAkhter/LocalIQ-HackCelestial-.git}
      CASC_JENKINS_CONFIG: /usr/share/jenkins/ref/casc
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false"
    volumes:
      - jenkins-home:/var/jenkins_home
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
    # Runs as root so it can access the mounted Docker socket (colima enforces
    # socket permissions per-uid). Acceptable for a trusted self-hosted CI box.
    user: root
    networks: [jenkins]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/login >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s

volumes:
  jenkins-home:

networks:
  jenkins:
    driver: bridge
