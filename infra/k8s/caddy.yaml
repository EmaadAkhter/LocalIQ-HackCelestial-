apiVersion: v1
kind: ConfigMap
metadata:
  name: caddy-config
  namespace: localiq
data:
  Caddyfile: |
    {
        admin off
        auto_https off
    }

    :80 {
        encode zstd gzip

        route /api/* {
            reverse_proxy kong:8000
        }

        route /llm/* {
            reverse_proxy kong:8000
        }

        route /healthz {
            respond "ok" 200
        }

        route {
            reverse_proxy flutter-web:80
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: caddy
  namespace: localiq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: caddy
  template:
    metadata:
      labels:
        app: caddy
    spec:
      containers:
        - name: caddy
          image: caddy:2-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: caddy-config
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
      volumes:
        - name: caddy-config
          configMap:
            name: caddy-config
---
apiVersion: v1
kind: Service
metadata:
  name: caddy
  namespace: localiq
spec:
  selector:
    app: caddy
  ports:
    - name: http
      port: 80
      targetPort: 80
