apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: localiq
data:
  APP_ENV: production
  CORS_ORIGINS: "https://localiq.tavesglobal.com,http://localhost:8080"
  DATABASE_URL: postgresql+psycopg2://localiq:change-me@postgres:5432/localiq
  # Point this at a reachable Ollama: the in-cluster service (`http://ollama:11434`)
  # or a shared, tunnelled endpoint (`https://<host>/llm` + OLLAMA_API_KEY).
  OLLAMA_URL: http://ollama:11434
  OLLAMA_MODEL: llama3.2:3b
  OLLAMA_API_KEY: ""
  # Google Maps / Places / Routes. Empty disables maps and the backend falls
  # back to the local SQLite dataset. Supply real values via a Secret.
  GOOGLE_MAPS_API_KEY_WEB: ""
  GOOGLE_MAPS_API_KEY_ANDROID: ""
  GOOGLE_MAPS_API_KEY_IOS: ""
  GOOGLE_PLACES_API_KEY: ""
  GOOGLE_ROUTES_API_KEY: ""
  # Empty disables /api/v1/admin/*. Replace with a Secret reference in production.
  ADMIN_API_KEY: ""
  FEEDBACK_WEIGHT: "4.0"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: localiq
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: localiq-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: backend-config
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 750m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: localiq
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
