apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: localiq
data:
  default.conf: |
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~* \.wasm$ {
            default_type application/wasm;
            try_files $uri =404;
        }

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        gzip on;
        gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flutter-web
  namespace: localiq
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flutter-web
  template:
    metadata:
      labels:
        app: flutter-web
    spec:
      containers:
        - name: nginx
          # Build from frontend_flutter/ once the Flutter web bundle exists:
          #   flutter build web
          #   docker build -t localiq-frontend:latest frontend_flutter
          image: localiq-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: flutter-web
  namespace: localiq
spec:
  selector:
    app: flutter-web
  ports:
    - port: 80
      targetPort: 80
