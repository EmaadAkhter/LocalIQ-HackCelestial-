server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback for Flutter web routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Flutter web ships WebAssembly (CanvasKit); ensure the right MIME type.
    location ~* \.wasm$ {
        default_type application/wasm;
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;
}
