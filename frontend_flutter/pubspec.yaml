name: localiq
description: "LocalIQ - Discover Local Smarter. Premium Mumbai travel companion."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State management (simple, no codegen)
  provider: ^6.1.2

  # Maps (API key injected at build time - never committed)
  google_maps_flutter: ^2.10.0
  geolocator: ^13.0.2

  # Utilities
  http: ^1.2.2
  intl: ^0.19.0
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.3

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
