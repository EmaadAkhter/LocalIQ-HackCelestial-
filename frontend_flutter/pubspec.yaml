name: localiq
description: LocalIQ — Feasibility-first local discovery. Know what you can realistically do right now.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^18.0.1
  google_fonts: ^8.2.1
  flutter_riverpod: ^3.4.3
  intl: ^0.20.3
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

# ---------------------------------------------------------------------------
# Environment configuration
#
# Every value is supplied at build/run time. No secret is ever committed.
#
#   flutter run \
#     --dart-define=LOCALIQ_API_BASE_URL=https://api.localiq.app/v1 \
#     --dart-define=LOCALIQ_GOOGLE_MAPS_API_KEY=... \
#     --dart-define=LOCALIQ_ENV=staging
#
# When a base URL is absent the app runs against the bundled offline dataset
# through the same repository interfaces, so the UI contract never changes.
# ---------------------------------------------------------------------------
